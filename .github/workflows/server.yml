name: AMDL Docker Server
on: [workflow_dispatch]
jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - run: |
          # 1. تشغيل السيرفر وفتح بورت المتصفح وبورت التحميل
          docker run -d --name amdl-box -p 7681:7681 -p 12340:12340 ghcr.io/akina-up/wrapper-amdl:latest
          
          # 2. تشغيل نفق المتصفح (عشان تسجل دخول أبل)
          sudo npm install -g localtunnel
          lt --port 7681 > login.log 2>&1 &
          
          # 3. تشغيل نفق كلاودفلير (عشان Termux والتحميل)
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared
          ./cloudflared tunnel --url http://127.0.0.1:12340 --no-chunked-encoding > api.log 2>&1 &
          sleep 15
          
          # 4. سحب الروابط وإرسالها
          LOGIN_LINK=$(grep -o 'https://.*\.loca\.lt' login.log | head -n 1)
          API_LINK=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' api.log | head -n 1)
          
          curl -d "رابط تسجيل الدخول (للمتصفح): $LOGIN_LINK" "https://ntfy.sh/amdl_server_${{ github.actor }}"
          curl -d "رابط تيرموكس (للتحميل): $API_LINK" "https://ntfy.sh/amdl_server_${{ github.actor }}"
          
          sleep 21600
