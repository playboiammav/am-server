name: Wrapper Server
on: [workflow_dispatch]
jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt update && sudo apt install -y clang wget curl
      - run: |
          git clone -b lite https://github.com/WorldObservationLog/wrapper.git
          cd wrapper
          clang wrapper-lite.c cmdline.c -o wrapper-lite -ldl
      - run: |
          cd wrapper
          sudo ./wrapper-lite &
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared
          ./cloudflared tunnel --url http://127.0.0.1:12340 > tunnel.log 2>&1 &
          sleep 15
          LINK=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' tunnel.log | head -n 1)
          curl -d "$LINK" "https://ntfy.sh/amdl_server_${{ github.actor }}"
          sleep 21600
