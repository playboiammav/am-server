name: AMDL Docker Server
on: [workflow_dispatch]
jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - run: |
          docker run -d --name amdl-box --network host ghcr.io/akina-up/wrapper-amdl:latest
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared
          ./cloudflared tunnel --url http://127.0.0.1:7681 > web.log 2>&1 &
          sleep 5
          ./cloudflared tunnel --url http://127.0.0.1:10020 > api.log 2>&1 &
          sleep 15
          WEB_LINK=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' web.log | head -n 1)
          API_LINK=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' api.log | head -n 1)
          curl -d "رابط 1 (للمتصفح): $WEB_LINK" "https://ntfy.sh/amdl_server_${{ github.actor }}"
          curl -d "رابط 2 (لتيرموكس): $API_LINK" "https://ntfy.sh/amdl_server_${{ github.actor }}"
          sleep 21600
